name: iOS App Store Build

# Builds the SerikaCord iOS app (mobile/ios, Capacitor), signs it for the App
# Store, attaches the IPA to a GitHub release and uploads it to TestFlight.
# Setup checklist (Apple, App Store Connect, Firebase, secrets): mobile/README.md.
#
#   git tag ios-v2.4.0 && git push origin ios-v2.4.0
#
# The tag's version becomes CFBundleShortVersionString; the build number is
# CURRENT_PROJECT_VERSION from the Xcode project (bumped by scripts/release.ts)
# unless the manual run overrides it. App Store Connect refuses a build number
# it has already seen for that version.

on:
  push:
    tags:
      - 'ios-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. ios-v2.4.0)'
        required: true
        type: string
      build_number:
        description: 'Build number (CFBundleVersion). Empty = CURRENT_PROJECT_VERSION from the Xcode project'
        required: false
        type: string
      testflight:
        description: 'Upload to TestFlight'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
      UPLOAD_TESTFLIGHT: ${{ github.event_name == 'push' || inputs.testflight }}
      # Apple Developer team (Serika). An Actions variable APPLE_TEAM_ID overrides it.
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'B648X59JCQ' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          # IOS_DISTRIBUTION_P12_PASSWORD is optional (a P12 exported without a password).
          for name in IOS_DISTRIBUTION_P12_BASE64 SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64 IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "$UPLOAD_TESTFLIGHT" = "true" ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
              [ -n "${!name:-}" ] || missing+=("$name")
            done
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Actions secrets: ${missing[*]}. See mobile/README.md (iOS > GitHub secrets)."
            exit 1
          fi
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID '$APPLE_TEAM_ID' is not a 10-character team ID"; exit 1; }
          if [ "$UPLOAD_TESTFLIGHT" = "true" ]; then
            [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]] || { echo "::error::ASC_KEY_ID looks wrong (expected the key ID, e.g. 2X9R4HXF34)"; exit 1; }
          fi

      - name: Resolve version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^ios-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' must look like ios-v1.2.3"
            exit 1
          fi
          echo "IOS_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build number
        run: |
          set -euo pipefail
          PBX=mobile/ios/App/App.xcodeproj/project.pbxproj
          PROJECT_VERSION=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' "$PBX" | sed 's/.*= //')
          PROJECT_BUILD=$(grep -m1 -oE 'CURRENT_PROJECT_VERSION = [0-9]+' "$PBX" | sed 's/.*= //')
          BUILD="${BUILD_NUMBER_INPUT:-$PROJECT_BUILD}"
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Build number '$BUILD' must be a whole number"; exit 1; }
          if [ "$PROJECT_VERSION" != "$IOS_VERSION" ]; then
            echo "::warning::Tag version $IOS_VERSION differs from MARKETING_VERSION $PROJECT_VERSION in the Xcode project; building $IOS_VERSION."
          fi
          echo "IOS_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "IPA_PATH=$RUNNER_TEMP/SerikaCord-${RELEASE_TAG}.ipa" >> "$GITHUB_ENV"
          echo "Building SerikaCord iOS $IOS_VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # App Store uploads need the iOS 26 SDK; Firebase 13 needs Swift 6.2.
          xcode-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Sync Capacitor
        working-directory: mobile
        run: bunx cap sync ios

      - name: Firebase config
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > mobile/ios/App/App/GoogleService-Info.plist
          python3 scripts/ios-ci.py google-services mobile/ios/App/App/GoogleService-Info.plist

      - name: Install signing certificate and profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$SERIKACORD_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/serikacord.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/serikacord.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/ios-ci.py profile "$RUNNER_TEMP/profile.plist"

          KEYCHAIN="$RUNNER_TEMP/serikacord-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/identities.txt"
          python3 scripts/ios-ci.py identity "$RUNNER_TEMP/identities.txt"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/serikacord.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12"

      - name: Configure signing and version
        run: python3 scripts/ios-ci.py project

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SerikaCord.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation -quiet \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SerikaCord.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          python3 scripts/ios-ci.py verify-ipa "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 14

      - name: Attach IPA to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # --latest=false: the desktop updaters read releases/latest, which
            # must stay on the desktop release (v*).
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest=false \
              --title "SerikaCord for iOS $IOS_VERSION" \
              --notes "SerikaCord for iPhone and iPad $IOS_VERSION (build $IOS_BUILD_NUMBER). Installs go through TestFlight / the App Store; this IPA is App Store signed and can't be sideloaded."
          fi
          gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber

      - name: Upload to TestFlight
        if: env.UPLOAD_TESTFLIGHT == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYS="$RUNNER_TEMP/asc/private_keys"
          mkdir -p "$KEYS"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEYS/AuthKey_${ASC_KEY_ID}.p8"
          cd "$RUNNER_TEMP/asc"
          export API_PRIVATE_KEYS_DIR="$KEYS"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $IOS_VERSION ($IOS_BUILD_NUMBER) to App Store Connect. It shows up in TestFlight once Apple finishes processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/serikacord-signing.keychain-db" 2>/dev/null || true
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/serikacord.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/identities.txt" mobile/ios/App/App/GoogleService-Info.plist
